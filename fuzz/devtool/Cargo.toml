[package]
name = "jolt-fuzz-dev"
version = "0.0.0"
edition = "2021"
publish = false

# Uninstrumented developer tool over the harness library: seed generation,
# smoke/replay runs without libFuzzer, and exhaustive sweeps. `jolt-fuzz
# prepare` uses it to generate seeds; it is not part of the distribution.
[[bin]]
name = "jolt-fuzz-dev"
path = "src/main.rs"

[dependencies]
jolt-akita = { path = "../../crates/jolt-akita" }
jolt-akita-fuzz = { path = ".." }
rayon = "1.12"
akita-config = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d98400c555a7fc779bb4e29c35fbd4adad3232d1", default-features = false }
akita-params = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d98400c555a7fc779bb4e29c35fbd4adad3232d1", default-features = false }
akita-planner = { git = "https://github.com/LayerZero-Labs/akita.git", rev = "d98400c555a7fc779bb4e29c35fbd4adad3232d1", default-features = false }
