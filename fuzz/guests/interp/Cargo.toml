[package]
name = "jolt-fuzz-interp-guest"
version = "0.1.0"
edition = "2021"
publish = false

[features]
guest = []

[dependencies]
jolt = { package = "jolt-sdk", path = "../../../jolt-sdk" }
# `alloc` lets the no_std guest deserialize `Vec<u8>` arguments.
serde = { version = "1", default-features = false, features = ["alloc"] }

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "jolt-fuzz-interp-guest"
path = "src/main.rs"
test = false
bench = false
